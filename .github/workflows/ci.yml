name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
      - name: Render image can import the API
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: mojichat_import_check
          JWT_SECRET: ci_test_secret_long_enough_value
        run: |
          python -m venv /tmp/render-venv
          /tmp/render-venv/bin/pip install --upgrade pip
          /tmp/render-venv/bin/pip install -r requirements.prod.txt \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          /tmp/render-venv/bin/python -c 'import server'
      - name: Critical flake8
        working-directory: backend
        run: ./venv/bin/flake8 server.py file_storage.py --select=E9,F63,F7,F82
      - name: Firebase auth tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: mojichat_firebase_tests
          JWT_SECRET: ci_test_secret_long_enough_value
          CORS_ORIGINS: "*"
        run: ./venv/bin/python -m pytest tests/test_firebase_auth.py -q
      - name: Reset email tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: mojichat_reset_tests
          JWT_SECRET: ci_test_secret_long_enough_value
          CORS_ORIGINS: "*"
        run: ./venv/bin/python -m pytest tests/test_reset_email.py -q
      - name: Stage 0 security tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: mojichat_stage0_tests
          JWT_SECRET: ci_test_secret_long_enough_value
          CORS_ORIGINS: "*"
        run: ./venv/bin/python -m pytest tests/test_stage0_hotfix.py -q
      - name: Conversation authorization tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: mojichat_authz_tests
          JWT_SECRET: ci_test_secret_long_enough_value
          CORS_ORIGINS: "*"
        run: ./venv/bin/python -m pytest tests/test_stage1_authz.py -q
      - name: Profile and email tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: mojichat_pii_tests
          JWT_SECRET: ci_test_secret_long_enough_value
          CORS_ORIGINS: "*"
        run: ./venv/bin/python -m pytest tests/test_stage1_pii.py -q
      - name: Session and CORS tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: mojichat_session_tests
          JWT_SECRET: ci_test_secret_long_enough_value
          CORS_ORIGINS: "*"
        run: ./venv/bin/python -m pytest tests/test_stage1_session.py -q
      - name: LLM limit tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: mojichat_llm_tests
          JWT_SECRET: ci_test_secret_long_enough_value
          CORS_ORIGINS: "*"
        run: ./venv/bin/python -m pytest tests/test_stage1_llm.py -q
      - name: Upload storage tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: mojichat_upload_tests
          JWT_SECRET: ci_test_secret_long_enough_value
          CORS_ORIGINS: "*"
        run: ./venv/bin/python -m pytest tests/test_stage1_uploads.py -q
      - name: Stage 2 reaction and voice tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: mojichat_stage2_tests
          JWT_SECRET: ci_test_secret_long_enough_value
          CORS_ORIGINS: "*"
        run: ./venv/bin/python -m pytest tests/test_stage2.py -q
      - name: Stage 4 backlog tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: mojichat_backlog_tests
          JWT_SECRET: ci_test_secret_long_enough_value
          CORS_ORIGINS: "*"
        run: ./venv/bin/python -m pytest tests/test_stage4_backlog.py -q
      - name: Stage 4 pagination tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: mojichat_stage4_tests
          JWT_SECRET: ci_test_secret_long_enough_value
          CORS_ORIGINS: "*"
        run: ./venv/bin/python -m pytest tests/test_stage4_pagination.py -q
      - name: Stage 3 push subscription tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: mojichat_stage3_push_tests
          JWT_SECRET: ci_test_secret_long_enough_value
          CORS_ORIGINS: "*"
        run: ./venv/bin/python -m pytest tests/test_stage3_push.py -q
      - name: Start API
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: mojichat_ci
          JWT_SECRET: ci_test_secret_long_enough_value
          CORS_ORIGINS: "*"
        run: |
          ./venv/bin/uvicorn server:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/docs >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/uvicorn.log
          exit 1
      - name: Backend contract tests
        working-directory: backend
        env:
          REACT_APP_BACKEND_URL: http://127.0.0.1:8000
        run: ./venv/bin/python -m pytest tests/test_ci_contract.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Chat guard tests
        working-directory: frontend
        run: node --test src/lib/chatGuards.test.mjs src/lib/calls.test.mjs src/lib/firebaseWebConfig.test.mjs
      - name: Install and build
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t mojichat-backend:ci backend
      - name: Image can import the API
        run: docker run --rm -e MONGO_URL=mongodb://127.0.0.1:27017 -e JWT_SECRET=ci_test_secret_long_enough_value mojichat-backend:ci python -c 'import server'

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Firebase key injection script
        run: node --test mobile/scripts/inject-google-services.test.js
      - name: Typecheck
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
