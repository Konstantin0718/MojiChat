name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
      - name: Critical flake8
        working-directory: backend
        run: ./venv/bin/flake8 server.py --select=E9,F63,F7,F82
      - name: Start API
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: mojichat_ci
          JWT_SECRET: ci_test_secret
          CORS_ORIGINS: "*"
        run: |
          ./venv/bin/uvicorn server:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/docs >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/uvicorn.log
          exit 1
      - name: Backend contract tests
        working-directory: backend
        env:
          REACT_APP_BACKEND_URL: http://127.0.0.1:8000
        run: ./venv/bin/python -m pytest tests/test_ci_contract.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install and build
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build
